<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>💈 Barbearia</title>

<style>

body{
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:15px;
margin:0;
}

h2{
text-align:center;
margin-bottom:15px;
}

#status,#total,#contadores{
background:#222;
padding:12px;
border-radius:10px;
margin-bottom:12px;
text-align:center;
}

#total{
font-size:22px;
font-weight:bold;
background:#1d4f1d;
}

#contadores{
line-height:1.8;
font-size:16px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

button{
padding:18px;
font-size:18px;
font-weight:bold;
border:none;
border-radius:12px;
background:white;
cursor:pointer;
}

button:active{
transform:scale(0.97);
}

</style>
</head>

<body>

<h2>💈 Barbearia</h2>

<div id="status">
Pronto
</div>

<div id="total">
Hoje: 0€
</div>


<div class="grid">

<button onclick="send('CorteBarba',20)">
💈 Corte + Barba<br>
20€
</button>

<button onclick="send('Degrade',16)">
✂️ Degradê<br>
16€
</button>

<button onclick="send('CorteSimples',14)">
✂️ Corte Simples<br>
14€
</button>

<button onclick="send('CriancaNormal',11)">
👦 Criança Normal<br>
11€
</button>

<button onclick="send('CriancaDegrade',14)">
👦 Criança Degradê<br>
14€
</button>

<button onclick="send('Barba',10)">
🧔 Barba<br>
10€
</button>

<button onclick="send('Pintura',7)">
🎨 Pintura<br>
7€
</button>

<button onclick="send('Corte10',10)">
💶 Corte 10€<br>
10€
</button>

<button onclick="send('Corte15',15)">
💶 Corte 15€<br>
15€
</button>

<button onclick="desfazer()">
↩️ Desfazer
</button>

</div>

<br>

<div id="contadores"></div>

<script>

const url="https://script.google.com/macros/s/AKfycbwHHKI-Nc1K9QJPmQT0Hzt9yNk9Wj8eaET2dv5VT322vcImtvwq9JrwrkEpYgPhc2edWA/exec";

let total=
Number(localStorage.getItem("total"))||0;

let contadores=
JSON.parse(
localStorage.getItem("contadores")
)||{};

let historico=
JSON.parse(
localStorage.getItem("historico")
)||[];


function guardar(){

localStorage.setItem(
"total",
total
);

localStorage.setItem(
"contadores",
JSON.stringify(contadores)
);

localStorage.setItem(
"historico",
JSON.stringify(historico)
);

}


function atualizar(){

document.getElementById(
"total"
).innerText=
"Hoje: "+total+"€";


let texto="<b>📊 Contagem hoje</b><br><br>";

for(let item in contadores){

texto +=
item+
": "+
contadores[item]+
"<br>";

}

if(Object.keys(contadores).length==0){

texto+="Sem registos";

}

document.getElementById(
"contadores"
).innerHTML=
texto;

guardar();

}



async function send(
servico,
valor
){

document.getElementById(
"status"
).innerText=
"⏳ A registar...";

await fetch(
url+
"?servico="+
encodeURIComponent(servico)+
"&valor="+
valor,
{
mode:"no-cors"
}
);

total += valor;

contadores[servico]=
(contadores[servico]||0)+1;

historico.push({
servico,
valor
});

atualizar();

document.getElementById(
"status"
).innerText=
"✅ Registado";

}



function desfazer(){

if(historico.length==0){

document.getElementById(
"status"
).innerText=
"Sem histórico";

return;

}

let ultimo=
historico.pop();

total -=
ultimo.valor;

contadores[
ultimo.servico
]--;

if(
contadores[
ultimo.servico
]<=0
){

delete contadores[
ultimo.servico
];

}

atualizar();

document.getElementById(
"status"
).innerText=
"↩️ Último removido";

}


atualizar();

</script>

</body>
</html>
